rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        astral-sh/setup-uv: ref-pin
        codecov/codecov-action: ref-pin
        hynek/build-and-inspect-python-package: ref-pin
        pypa/gh-action-pypi-publish: ref-pin
  cache-poisoning:
   ignore:
    - build_test_deploy.yml
  # pixi-lock-push.yml runs on workflow_run but executes no PR code, and
  # validates its artifact before pushing it.
  dangerous-triggers:
   ignore:
    - docs.yml
    - pixi-lock-push.yml
