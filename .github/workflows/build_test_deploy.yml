name: Build-Test-Deploy

on:
  push:
    branches:
      - main
      - master
      - maint/*
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - master
      - maint/*
  schedule:
    # 8am EST / 9am EDT Mondays
    - cron: "0 13 * * 1"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Force pixi and pytest to use color
  FORCE_COLOR: true
  TEMPLATEFLOW_HOME: /tmp/templateflow

jobs:
  build:
    name: Build & verify package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clean up baipp virtualenv path (main build)
        run: rm -rf /tmp/baipp
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: build-smriprep
        with:
          upload-name-suffix: -main
          attest-build-provenance-github: ${{ github.event_name != 'pull_request' }}
      - name: Clean up package build
        run: rm -r "$DIST"
        env:
          DIST: ${{ steps.build-smriprep.outputs.dist }}
      - name: Clean up baipp virtualenv path (wrapper build)
        run: rm -rf /tmp/baipp
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: build-wrapper
        with:
          path: wrapper
          upload-name-suffix: -wrapper
          attest-build-provenance-github: ${{ github.event_name != 'pull_request' }}
      - name: Clean up wrapper build
        run: rm -r "$DIST"
        env:
          DIST: ${{ steps.build-wrapper.outputs.dist }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["dev", "min"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.78.0
          environments: ${{ matrix.environment }}
          locked: true
      - name: Display Python version
        run: pixi run -e ${{ matrix.environment }} python -c "import sys; print(sys.version)"

      - name: Restore cached templateflow
        id: tf-cache-restore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/templateflow
          key: templateflow-v0
          # Use the following to fall back to and build on v0 when bumping to v1
          # If the cache need to be cleared, remove this when bumping key version
          # restore-keys: |
          #   templateflow-v0
      - name: Initialize templateflow
        if: steps.tf-cache-restore.outputs.cache-hit != 'true'
        run: |
          uvx templateflow update --no-overwrite

      - name: Run test suite
        run: pixi run -e ${{ matrix.environment }} test
        timeout-minutes: 30
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
        if: ${{ always() }}

  test-packages:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Packages-*
          path: dist
      - run: ls -lR

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Restore cached templateflow
        id: tf-cache-restore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/templateflow
          key: templateflow-v0
          # Use the following to fall back to and build on v0 when bumping to v1
          # If the cache need to be cleared, remove this when bumping key version
          # restore-keys: |
          #   templateflow-v0
      - name: Check wrapper version
        run: |
          echo n | uvx --from=$( ls dist/*/smriprep_docker*.whl ) smriprep-docker --version

      - name: Unpack sdist
        run: |
          tar --strip-components=1 -xzf dist/*/smriprep-*.tar.gz

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.78.0
          environments: dev
          locked: true
      - name: Run test suite
        run: pixi run -e dev test
        timeout-minutes: 30
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}
        if: ${{ always() }}

  publish:
    name: Publish released package to pypi.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment: PyPI
    needs: [test, test-packages]
    permissions:
      attestations: write
      id-token: write

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Packages-*
          path: dist

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/Packages-main/

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/Packages-wrapper/
