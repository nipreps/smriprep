[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "smriprep"
description = "Structural MRI Preprocessing Pipelines"
readme = "README.rst"
authors = [{name = "The NiPreps Developers", email = "nipreps@gmail.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "acres >= 0.5.0",
    "indexed_gzip >= 1.8.7",
    "lockfile >= 0.12.2",
    "looseversion >= 1.3.0",
    "matplotlib >= 3.10",
    "nibabel >= 5.3.0",
    "nipost[bids] >= 0.1.0",
    "nipype >= 1.9.1",
    "nireports >= 25.3.0",
    "nitransforms >= 25.0.1",
    "niworkflows >= 1.14.4",
    "numpy >= 2.2",
    "packaging >= 24.2",
    "pybids >= 0.21",
    "pyyaml >= 6.0.2",
    "templateflow >= 25.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/nipreps/smriprep"
Documentation = "https://nipreps.org/smriprep"
"Docker Images" = "https://hub.docker.com/r/nipreps/smriprep/tags/"
NiPreps = "https://www.nipreps.org/"

[project.optional-dependencies]
datalad = ["datalad"]
doc = [
    "nbsphinx",
    "packaging",
    "pydot",
    "sphinx",
    "sphinx-argparse",
    "sphinx_rtd_theme",
    "sphinxcontrib-napoleon",
    "sphinxcontrib-versioning",
]
duecredit = ["duecredit"]
test = [
    "coverage[toml] >= 7.6.2",
    "pytest >= 8.3.3",
    "pytest-cov >= 6.0.0",
    "pytest-env >= 1.1.4",
    "pytest-xdist >= 3.7.0",
]
style = ["flake8"]
# Aliases
docs = ["smriprep[doc]"]
tests = ["smriprep[test]"]
all = ["smriprep[datalad,doc,duecredit,test]"]

[project.scripts]
smriprep = "smriprep.cli.run:main"

#
# Hatch configurations
#

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
exclude = [".git_archival.txt"]  # No longer needed in sdist

[tool.hatch.build.targets.wheel]
packages = ["src/smriprep"]

##  The following two sections configure setuptools_scm in the hatch way

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/smriprep/_version.py"

#
# Developer tool configurations
#

[tool.tox]
requires = ["tox>=4.21"]
env_list = ["py313-pre", "py314-pre", "py315-pre"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "Pytest with coverage against pre-release dependencies"
pip_pre = true
pass_env = [
    "TEMPLATEFLOW_HOME",
    "NO_ET",
    # Freesurfer variables searched for
    "FREESURFER_HOME",
    "SUBJECTS_DIR",
    "FS_LICENSE",
    # CI variables
    "TEST_DATA_HOME",
    "TEST_OUTPUT_DIR",
    "TEST_WORK_DIR",
    "FMRIPREP_REGRESSION_SOURCE",
    "CACHED_WORK_DIRECTORY",
    # CircleCI-specific
    "CIRCLE_NPROCS",
    "SAVE_CIRCLE_ARTIFACTS",
    # Pass user color preferences through
    "PY_COLORS",
    "FORCE_COLOR",
    "NO_COLOR",
    "CLICOLOR",
    "CLICOLOR_FORCE",
    "PYTHON_GIL",
]
extras = ["tests"]
commands_pre = [["python", "scripts/fetch_templates.py"]]
commands = [[
    "pytest",
    "--cov-report=term-missing",
    "--durations=20",
    "--durations-min=1.0",
    { replace = "posargs", default = ["-n", "auto"], extend = true },
]]

[tool.tox.env_run_base.set_env]
PIP_EXTRA_INDEX_URL = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple"
UV_INDEX = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple"
UV_INDEX_STRATEGY = "unsafe-best-match"
FSLOUTPUTTYPE = "NIFTI_GZ"

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["src", "test"]
log_level = "INFO"
xfail_strict = true
norecursedirs = [".git"]
addopts = [
  "-svx",
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  # Config pytest-cov
  "--cov=src/smriprep",
  "--cov-report=xml",
  "--cov-config=pyproject.toml",
]
doctest_optionflags = "ALLOW_UNICODE NORMALIZE_WHITESPACE ELLIPSIS"
env = "PYTHONHASHSEED=0"
filterwarnings = ["ignore::DeprecationWarning"]
junit_family = "xunit2"

[tool.coverage.run]
branch = true
source = ["smriprep"]
omit = [
    "*/tests/*",
]
relative_files = true

[tool.coverage.paths]
source = [
    "smriprep/",
    "*/site-packages/smriprep",
]

[tool.ruff]
line-length = 99
extend-exclude = [
  "wrapper/*.py",
  "docs/sphinxext/*",
]

[tool.ruff.lint]
extend-select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "YTT",
  "S",
  "BLE",
  "B",
  "A",
  # "CPY",
  "C4",
  "DTZ",
  "T10",
  # "EM",
  "EXE",
  "FA",
  "ISC",
  "ICN",
  "PT",
  "Q",
]
ignore = [
  "S311",  # We are not using random for cryptographic purposes
  "S603",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.extend-per-file-ignores]
"*/test_*.py" = ["S101"]
"docs/conf.py" = ["A001"]

[tool.ruff.format]
quote-style = "single"

[tool.codespell]
skip = "*/data/*,*docs/_build/*,*.svg,*docs/_static/*"

[tool.pixi.workspace]
channels = ["https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
FSLDIR = "$CONDA_PREFIX"

[tool.pixi.environments]
default = ["production", "conda"]  # "bare-metal"
dev = ["test", "conda"]
min = ["test", "conda", "min"]
# Use "smriprep" feature for container environment, so it is identifiable
smriprep = ["production", "container", "conda"]

[tool.pixi.pypi-dependencies]
smriprep = { path = ".", editable = true }
[tool.pixi.feature.production.pypi-dependencies]
smriprep = { path = ".", editable = false }

[tool.pixi.feature.test.tasks]
fetch-templates = "python scripts/fetch_templates.py"
test = { cmd = "pytest --cov-report term-missing --durations=20 --durations-min=1.0 -n auto", depends-on = ["fetch-templates"], env = { FSLOUTPUTTYPE = "NIFTI_GZ" } }

[tool.pixi.feature.min]
solve-strategy = "lowest-direct"
[tool.pixi.feature.min.dependencies]
python = "3.13.*"

[tool.pixi.feature.conda.dependencies]
ants = ">=2.6"
connectome-workbench-cli = { version = ">=2.0", build = "*qt6*" }
fsl-avwutils = ">=2209.3"  # fslmaths (fsl.ApplyMask)
fsl-bet2 = ">=2111.8"
fsl-flirt = ">=2111.4"
fsl-fast4 = ">=2111.3"
fsl-miscmaths = ">=2412.4"
graphviz = ">=12.2"
pandoc = ">=3.7"
# Installed from conda as dependencies of conda packages; keep in sync with
# project.dependencies so the min environment can resolve with lowest-direct
matplotlib = ">=3.10"
nibabel = ">=5.3"
numpy = ">=2.2"
packaging = ">=24.2"
pyyaml = ">=6.0.2"
# Indirect dependencies, but built against numpy (SPEC 0 floors)
h5py = ">=3.13"
pandas = ">=2.3"
scikit-image = ">=0.25"
scikit-learn = ">=1.6"
scipy = ">=1.15"

[tool.pixi.feature.container.dependencies]
git = "*"
nodejs = ">=20"

[tool.pixi.feature.container.pypi-dependencies]
git-annex = ">=10.20250721"
