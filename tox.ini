[tox]
requires =
  tox>=4
  tox-uv
envlist =
  py3{10,11,12,13}-latest
  py310-min
  py3{11,12,13}-pre
skip_missing_interpreters = true

# Configuration that allows us to split tests across GitHub runners effectively
[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313

[gh-actions:env]
DEPENDS =
  min: min
  latest: latest
  pre: pre

[testenv]
description = Pytest with coverage
labels = test
pip_pre =
  pre: true
pass_env =
  TEMPLATEFLOW_HOME
  NO_ET
  # Freesurfer variables searched for
  FREESURFER_HOME
  SUBJECTS_DIR
  FS_LICENSE
  # CI variables
  TEST_DATA_HOME
  TEST_OUTPUT_DIR
  TEST_WORK_DIR
  FMRIPREP_REGRESSION_SOURCE
  CACHED_WORK_DIRECTORY
  # CircleCI-specific
  CIRCLE_NPROCS
  SAVE_CIRCLE_ARTIFACTS
  # getpass.getuser() sources for Windows:
  LOGNAME
  USER
  LNAME
  USERNAME
  # Pass user color preferences through
  PY_COLORS
  FORCE_COLOR
  NO_COLOR
  CLICOLOR
  CLICOLOR_FORCE
  PYTHON_GIL
extras = tests
setenv =
  pre: PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
  pre: UV_INDEX=https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
  pre: UV_INDEX_STRATEGY=unsafe-best-match
  FSLOUTPUTTYPE=NIFTI_GZ
uv_resolution =
  min: lowest-direct

commands =
  pytest --durations=20 --durations-min=1.0 --cov-report term-missing {posargs:-n auto}
